<svg width="192" height="192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGradient)"/>

  <!-- Coin Circle -->
  <circle cx="96" cy="86" r="50" fill="white" opacity="0.95" filter="url(#shadow)"/>

  <!-- Dollar Sign -->
  <text x="96" y="110" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#667eea" text-anchor="middle">$</text>

  <!-- Bottom Chart Bars -->
  <g transform="translate(36, 150)">
    <rect x="0" y="6" width="18" height="18" rx="3" fill="white" opacity="0.9"/>
    <rect x="26" y="0" width="18" height="24" rx="3" fill="white" opacity="0.9"/>
    <rect x="52" y="8" width="18" height="16" rx="3" fill="white" opacity="0.9"/>
    <rect x="78" y="3" width="18" height="21" rx="3" fill="white" opacity="0.9"/>
    <rect x="104" y="10" width="18" height="14" rx="3" fill="white" opacity="0.9"/>
  </g>
</svg>
