<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow512">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient512)"/>

  <!-- Large Coin Circle -->
  <circle cx="256" cy="230" r="135" fill="white" opacity="0.95" filter="url(#shadow512)"/>

  <!-- Dollar Sign -->
  <text x="256" y="300" font-family="Arial, sans-serif" font-size="170" font-weight="bold" fill="#667eea" text-anchor="middle">$</text>

  <!-- Bottom Chart Bars -->
  <g transform="translate(96, 400)">
    <rect x="0" y="16" width="48" height="48" rx="8" fill="white" opacity="0.9" filter="url(#shadow512)"/>
    <rect x="70" y="0" width="48" height="64" rx="8" fill="white" opacity="0.9" filter="url(#shadow512)"/>
    <rect x="140" y="20" width="48" height="44" rx="8" fill="white" opacity="0.9" filter="url(#shadow512)"/>
    <rect x="210" y="8" width="48" height="56" rx="8" fill="white" opacity="0.9" filter="url(#shadow512)"/>
    <rect x="280" y="26" width="48" height="38" rx="8" fill="white" opacity="0.9" filter="url(#shadow512)"/>
  </g>
</svg>
